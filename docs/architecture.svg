<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="t d">
  <title id="t">How Ryuk works</title>
  <desc id="d">Phone inputs flow into two Cloudflare Workers that share a D1 database and an R2 bucket. Only free text goes to the LLM; money and health data are handled by plain code. Sign-in is Face ID only: passkeys on the web, a Secure Enclave key in the app.</desc>

  <defs>
    <radialGradient id="bg" cx="28%" cy="18%" r="95%">
      <stop offset="0" stop-color="#1d1622"/>
      <stop offset=".6" stop-color="#0f0c12"/>
      <stop offset="1" stop-color="#0b0a0d"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="worker" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset=".5" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".07"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#7c3aed"/>
    </marker>

    <!-- icons: 24×24, original line glyphs -->
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M3.5 11.2 20.5 3.5 14 20.5l-2.9-7.3z M11.1 13.2 20.5 3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-sms" viewBox="0 0 24 24"><path d="M4 5.5h16v10.5H9.5L5 20v-4H4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 8.3h5M9.5 10.3h5M11 8.3c2.4 0 2.4 3.5 0 3.5H9.5l3.6 2.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.4A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M6.5 12.2h3l1.3-2.6 2 5 1.4-2.4h3.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4.5 19.5l1-4.3L16 4.7l3.3 3.3L8.8 18.5z M14 6.7l3.3 3.3 M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-browser" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 8.8h18" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="6.7" r=".8" fill="currentColor"/><circle cx="8.4" cy="6.7" r=".8" fill="currentColor"/></symbol>
    <symbol id="i-cube" viewBox="0 0 24 24"><path d="M12 2.8l8 4.6v9.2L12 21.2l-8-4.6V7.4z M12 12l8-4.6 M12 12v9.2 M12 12 4 7.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18.5h10.5a4 4 0 0 0 .4-8 6 6 0 0 0-11.6 1.3A3.4 3.4 0 0 0 7 18.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.8l2.1 6.1 6.1 2.1-6.1 2.1L12 19.2l-2.1-6.1L3.8 11l6.1-2.1z M19 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.8l8 3v6.1c0 5-3.4 8.3-8 9.3-4.6-1-8-4.3-8-9.3V5.8z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.6 12.2l2.4 2.4 4.6-4.9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-face" viewBox="0 0 24 24"><path d="M3.5 8V5.5a2 2 0 0 1 2-2H8 M16 3.5h2.5a2 2 0 0 1 2 2V8 M3.5 16v2.5a2 2 0 0 0 2 2H8 M16 20.5h2.5a2 2 0 0 0 2-2V16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 9v1.4 M15 9v1.4 M12 9v4.3h-1 M9.4 16.2c1.5 1.1 3.7 1.1 5.2 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2" fill="currentColor"/><path d="M8.3 10.5V8a3.7 3.7 0 0 1 7.4 0v2.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>

  <style>
    .t  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h  { font-size: 15px; font-weight: 650; fill: #0f172a; }
    .s  { font-size: 12px; fill: #64748b; }
    .b  { font-size: 12.5px; fill: #334155; }
    .k  { font-size: 10.5px; letter-spacing: .16em; fill: #64748b; }
    .pill { font-size: 10.5px; fill: #475569; }
    .wire { fill: none; stroke: #94a3b8; stroke-width: 1.6; }
    .wireRed { fill: none; stroke: #7c3aed; stroke-width: 1.7; stroke-dasharray: 5 4; }
  </style>

  <!-- canvas -->
  <rect width="1280" height="720" rx="22" fill="#ffffff"/>
  <rect x=".5" y=".5" width="1279" height="719" rx="21.5" fill="none" stroke="#e2e8f0"/>

  <!-- heading -->
  <text x="44" y="52" class="m k">HOW RYUK WORKS</text>
  <text x="44" y="78" class="t" font-size="20" font-weight="650" fill="#0f172a">One line on your phone → typed rows → a notebook you can read</text>

  <!-- ===================== left: you ===================== -->
  <text x="44" y="124" class="m k">WRITE</text>
  <g class="t">
    <!-- Telegram -->
    <g transform="translate(44,136)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-send" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">Telegram</text><text x="62" y="45" class="s">sets, meals, notes · /gym</text>
    </g>
    <!-- Bank SMS -->
    <g transform="translate(44,208)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-sms" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">Bank SMS</text><text x="62" y="45" class="s">Shortcut automation</text>
    </g>
    <!-- Health -->
    <g transform="translate(44,280)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-heart" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">Apple Health</text><text x="62" y="45" class="s">nightly Shortcut</text>
    </g>
    <!-- Text log -->
    <g transform="translate(44,352)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-pen" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">Quick log</text><text x="62" y="45" class="s">share sheet · Siri</text>
    </g>
  </g>

  <text x="44" y="470" class="m k">READ &amp; EDIT</text>
  <g class="t">
    <!-- iPhone app -->
    <g transform="translate(44,482)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-phone" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">iPhone app</text><text x="62" y="45" class="s">Capacitor shell · Face ID</text>
    </g>
    <!-- Browser -->
    <g transform="translate(44,554)" filter="url(#shadow)">
      <rect width="244" height="60" rx="14" fill="url(#card)" stroke="#e2e8f0"/>
      <circle cx="32" cy="30" r="18" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-browser" x="21" y="19" width="22" height="22" color="#2563eb"/>
      <text x="62" y="26" class="h">Browser</text><text x="62" y="45" class="s">any device · passkey</text>
    </g>
  </g>

  <!-- ===================== middle: Cloudflare ===================== -->
  <rect x="384" y="112" width="512" height="560" rx="20" fill="#fff7ed" fill-opacity=".45" stroke="#f38020" stroke-opacity=".7" stroke-dasharray="6 6"/>
  <g transform="translate(402,100)">
    <rect width="214" height="24" rx="12" fill="#fff7ed" stroke="#f38020" stroke-opacity=".7"/>
    <use href="#i-cloud" x="10" y="3" width="18" height="18" color="#F38020"/>
    <text x="34" y="16.5" class="m" font-size="10.5" letter-spacing=".14em" fill="#c2410c">CLOUDFLARE · FREE TIER</text>
  </g>

  <!-- bot worker -->
  <g transform="translate(412,140)" class="t" filter="url(#shadow)">
    <rect width="270" height="268" rx="16" fill="url(#worker)" stroke="#cbd5e1"/>
    <rect width="270" height="4" rx="2" fill="#2563eb" opacity=".9"/>
    <use href="#i-cube" x="18" y="20" width="24" height="24" color="#2563eb"/>
    <text x="52" y="38" class="m" font-size="18" font-weight="700" fill="#0f172a">ryuk</text>
    <text x="104" y="37" class="m k">BOT WORKER</text>
    <g class="b">
      <text x="20" y="76">▸ Telegram webhook, gym mode, batch notes</text>
      <text x="20" y="102">▸ Bank SMS → regex parser</text>
      <text x="20" y="128">▸ Health → field map, one row a day</text>
      <text x="20" y="154">▸ Filing rules · HMAC dedupe</text>
      <text x="20" y="180">▸ Buffers, validates, retries</text>
    </g>
    <g transform="translate(20,204)">
      <rect width="230" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0"/>
      <use href="#i-clock" x="10" y="11" width="22" height="22" color="#64748b"/>
      <text x="40" y="20" class="b">Nightly summary</text>
      <text x="40" y="36" class="m" font-size="10.5" fill="#64748b">cron · 22:00 IST</text>
    </g>
  </g>

  <!-- service binding -->
  <path d="M547 408 V 452" class="wire" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <g transform="translate(560,418)"><rect width="150" height="22" rx="11" fill="#f8fafc" stroke="#e2e8f0"/><text x="12" y="15" class="m pill">Service Binding RPC</text></g>

  <!-- dash worker -->
  <g transform="translate(412,456)" class="t" filter="url(#shadow)">
    <rect width="270" height="196" rx="16" fill="url(#worker)" stroke="#cbd5e1"/>
    <rect width="270" height="4" rx="2" fill="#2563eb" opacity=".9"/>
    <use href="#i-cube" x="18" y="20" width="24" height="24" color="#2563eb"/>
    <text x="52" y="38" class="m" font-size="18" font-weight="700" fill="#0f172a">ryuk-dash</text>
    <text x="156" y="37" class="m k">DASHBOARD</text>
    <g class="b">
      <text x="20" y="76">▸ Face ID sign-in · sessions</text>
      <text x="20" y="102">▸ REST API: page, money, board</text>
      <text x="20" y="128">▸ Files, Range requests</text>
      <text x="20" y="154">▸ React UI, one inlined file</text>
    </g>
    <text x="20" y="180" class="m" font-size="10.5" fill="#64748b">CSRF origin check · CSP nonce</text>
  </g>

  <!-- D1 -->
  <g transform="translate(744,214)" class="t">
    <path d="M0 18 v86 c0 10 30 18 64 18 s64-8 64-18 v-86" fill="url(#cyl)" stroke="#94a3b8"/>
    <ellipse cx="64" cy="18" rx="64" ry="18" fill="#f1f5f9" stroke="#94a3b8"/>
    <path d="M0 50 c0 10 30 18 64 18 s64-8 64-18 M0 80 c0 10 30 18 64 18 s64-8 64-18" fill="none" stroke="#cbd5e1"/>
    <text x="64" y="148" text-anchor="middle" class="h">D1</text>
    <text x="64" y="166" text-anchor="middle" class="s">SQLite · 30+ tables</text>
  </g>

  <!-- R2 -->
  <g transform="translate(752,502)" class="t">
    <path d="M6 10 h100 l-10 74 h-80 z" fill="url(#cyl)" stroke="#94a3b8" stroke-linejoin="round"/>
    <ellipse cx="56" cy="10" rx="50" ry="10" fill="#f1f5f9" stroke="#94a3b8"/>
    <path d="M26 36 h60 M30 56 h52" stroke="#cbd5e1"/>
    <text x="56" y="110" text-anchor="middle" class="h">R2</text>
    <text x="56" y="128" text-anchor="middle" class="s">books · videos · pins</text>
  </g>

  <!-- ===================== right ===================== -->
  <!-- LLM -->
  <g transform="translate(948,136)" class="t" filter="url(#shadow)">
    <rect width="288" height="118" rx="16" fill="url(#card)" stroke="#cbd5e1"/>
    <circle cx="36" cy="38" r="20" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-spark" x="24" y="26" width="24" height="24" color="#2563eb"/>
    <text x="68" y="34" class="h">Gemini Flash-Lite</text>
    <text x="68" y="52" class="s">LLM · structured output</text>
    <text x="20" y="84" class="b">JSON schema · validated before insert</text>
    <text x="20" y="104" class="b">fallback model · per-model timeout</text>
  </g>

  <!-- privacy -->
  <g transform="translate(948,282)" class="t" filter="url(#shadow)">
    <rect width="288" height="150" rx="16" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="36" cy="38" r="20" fill="#dcfce7" stroke="#86efac"/><use href="#i-shield" x="24" y="26" width="24" height="24" color="#16a34a"/>
    <text x="68" y="34" class="h">Private by design</text>
    <text x="68" y="52" class="s">money &amp; health stay in plain code</text>
    <text x="20" y="84" class="b">never sent to the LLM or Telegram</text>
    <text x="20" y="106" class="b">no SMS text · last 4 digits only</text>
    <text x="20" y="128" class="b">one key per Shortcut, constant-time</text>
  </g>

  <!-- auth -->
  <g transform="translate(948,460)" class="t" filter="url(#shadow)">
    <rect width="288" height="192" rx="16" fill="url(#card)" stroke="#cbd5e1"/>
    <circle cx="36" cy="38" r="20" fill="#eff6ff" stroke="#bfdbfe"/><use href="#i-face" x="24" y="26" width="24" height="24" color="#2563eb"/>
    <text x="68" y="34" class="h">Face ID only</text>
    <text x="68" y="52" class="s">no passwords, no Google</text>
    <text x="20" y="86" class="b">Web: passkeys (WebAuthn)</text>
    <text x="20" y="108" class="b">App: Secure Enclave P-256 key</text>
    <text x="20" y="130" class="b">__Host- cookie · SHA-256 at rest</text>
    <text x="20" y="152" class="b">30 days idle · 90 days max</text>
    <text x="20" y="176" class="m" font-size="10.5" fill="#64748b">docs/AUTH.md</text>
  </g>

  <!-- ===================== wires ===================== -->
  <!-- inputs → bot -->
  <path d="M288 166 C 350 166, 350 200, 410 200" class="wire" marker-end="url(#arrow)"/>
  <path d="M288 238 C 350 238, 350 242, 410 242" class="wire" marker-end="url(#arrow)"/>
  <path d="M288 310 C 350 310, 350 284, 410 284" class="wire" marker-end="url(#arrow)"/>
  <path d="M288 382 C 350 382, 350 326, 410 326" class="wire" marker-end="url(#arrow)"/>
  <g class="m pill">
    <g transform="translate(300,170)"><rect width="88" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="9" y="12.5">secret token</text></g>
    <g transform="translate(300,229)"><rect width="88" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><use href="#i-lock" x="7" y="4" width="10" height="10" color="#16a34a"/><text x="21" y="12.5">INGEST_KEY</text></g>
    <g transform="translate(300,288)"><rect width="88" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><use href="#i-lock" x="7" y="4" width="10" height="10" color="#16a34a"/><text x="21" y="12.5">HEALTH_KEY</text></g>
    <g transform="translate(300,356)"><rect width="88" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="9" y="12.5">LOG_KEY</text></g>
  </g>

  <!-- clients → dash -->
  <path d="M288 512 C 350 512, 350 516, 410 516" class="wire" marker-end="url(#arrow)"/>
  <path d="M288 584 C 350 584, 350 572, 410 572" class="wire" marker-end="url(#arrow)"/>
  <g class="m pill">
    <g transform="translate(298,490)"><rect width="96" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="9" y="12.5">device key sig</text></g>
    <g transform="translate(298,590)"><rect width="96" height="18" rx="9" fill="#f8fafc" stroke="#e2e8f0"/><text x="9" y="12.5">passkey · cookie</text></g>
  </g>

  <!-- bot → LLM (free text only) -->
  <path d="M682 176 C 800 176, 840 196, 946 196" class="wireRed" marker-end="url(#arrowRed)"/>
  <g transform="translate(744,160)"><rect width="104" height="20" rx="10" fill="#f5f3ff" stroke="#c4b5fd"/><text x="11" y="14" class="m" font-size="10.5" fill="#6d28d9">free text only</text></g>

  <!-- workers → storage -->
  <path d="M682 290 C 712 290, 716 278, 742 278" class="wire" marker-end="url(#arrow)"/>
  <path d="M682 520 C 760 520, 808 460, 808 384" class="wire" marker-end="url(#arrow)"/>
  <path d="M682 596 C 716 596, 724 560, 756 560" class="wire" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="44" y="690" class="m" font-size="11" letter-spacing=".12em" fill="#94a3b8">₹0 / MONTH · 2 WORKERS · 1 DATABASE · 0 SERVERS TO RUN</text>
  <text x="1236" y="690" text-anchor="end" class="m" font-size="11" letter-spacing=".12em" fill="#94a3b8">TYPESCRIPT · REACT · SWIFT</text>
</svg>
