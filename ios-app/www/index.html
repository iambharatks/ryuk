<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    body { background: #0B0B0E; color: #ccc; font-family: -apple-system, sans-serif;
           display: flex; justify-content: center; align-items: center;
           min-height: 100vh; margin: 0; padding: 0 24px; box-sizing: border-box; text-align: center; }
    #err { color: #c9c9d1; font-size: 14px; line-height: 1.5; max-width: 360px; }
    button { margin-top: 16px; background: none; color: #ccc; border: 1px solid #444;
             border-radius: 8px; padding: 8px 16px; font-size: 14px; }
  </style>
</head>
<body>
  <!-- The native RyukViewController loads the dashboard and opens the Face ID sign-in sheet when needed. -->
  <div>
    <p id="msg">Loading Ryuk…</p>
    <p id="err" hidden></p>
    <button id="retry" hidden onclick="ryukRetry()">Retry</button>
  </div>
  <script>
    function ryukRetry() {
      var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.ryukRetry;
      if (h) h.postMessage(1);
    }
    // message: what to say (null = just loading); button: label for the button (null = none)
    window.ryukStatus = function (message, button) {
      var err = document.getElementById('err'), retry = document.getElementById('retry');
      err.textContent = message || '';
      err.hidden = !message;
      retry.textContent = button || 'Try again';
      retry.hidden = !button;
      document.getElementById('msg').textContent = message ? 'Ryuk' : 'Opening Ryuk…';
    };
  </script>
</body>
</html>
